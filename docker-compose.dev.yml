# Dev overrides — hot reload, published dev ports (api, inference, postgres, redis), .env passthrough
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./services/api/src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  inference:
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./services/inference/mock/src:/app/src:ro
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
