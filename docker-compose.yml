services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mise}
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-mise}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runner
    environment:
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mise}
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      SQL_ECHO: ${SQL_ECHO:-false}
      REDIS_URL: redis://redis:6379/0
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_SECRET_KEY: ${API_SECRET_KEY:-change_me_in_production}
      OWNER_API_KEY: ${OWNER_API_KEY:-change_me_in_production}
      STAFF_PIN: ${STAFF_PIN:-0000}
      PUBLIC_GUEST_URL: ${PUBLIC_GUEST_URL:-http://localhost:3000}
      LLM_BASE_URL: http://inference:8080/v1
      LLM_MODEL: ${LLM_MODEL:-mock-llm}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      VLM_BASE_URL: http://inference:8080/v1
      VLM_MODEL: ${VLM_MODEL:-mock-vlm}
      DEMO_RESTAURANT_SLUG: ${DEMO_RESTAURANT_SLUG:-trattoria-da-mario}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  api-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mise}_test
      POSTGRES_USER: ${POSTGRES_USER:-mise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      REDIS_URL: redis://redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY:-change_me_in_production}
      OWNER_API_KEY: ${OWNER_API_KEY:-change_me_in_production}
      STAFF_PIN: ${STAFF_PIN:-0000}
      PUBLIC_GUEST_URL: ${PUBLIC_GUEST_URL:-http://localhost:3000}
      LLM_BASE_URL: http://inference:8080/v1

  inference:
    build:
      context: services/inference/mock
    environment:
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-100}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0.0}
      MOCK_TIMEOUT_MS: ${MOCK_TIMEOUT_MS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/models')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  guest-web:
    build:
      context: .
      dockerfile: apps/guest-web/Dockerfile
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  owner-web:
    build:
      context: .
      dockerfile: apps/owner-web/Dockerfile
      args:
        API_URL: http://api:8000
    ports:
      - "3001:3001"
    environment:
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
  redisdata:
